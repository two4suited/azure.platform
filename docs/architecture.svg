<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1045" width="1200" height="1045" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Azure platform architecture</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="1045" fill="url(#bg)"/>

  <!-- Title -->
  <text x="40" y="44" font-size="26" font-weight="700" fill="#0f172a">Azure Platform</text>
  <text x="40" y="68" font-size="14" fill="#64748b">Shared and Environment are provisioned with Pulumi. Apps are deployed with Aspire and reference both by name.</text>

  <!-- Client -->
  <g filter="url(#shadow)">
    <rect x="70" y="90" width="230" height="50" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <text x="185" y="120" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Clients</text>

  <!-- Entra app -->
  <g filter="url(#shadow)">
    <rect x="400" y="85" width="240" height="60" rx="12" fill="#ffffff" stroke="#ddd6fe"/>
    <rect x="400" y="85" width="6" height="60" rx="3" fill="#7c3aed"/>
  </g>
  <text x="520" y="110" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Entra app registration</text>
  <text x="520" y="129" font-size="12" fill="#64748b" text-anchor="middle">sign-in and API access tokens</text>
  <path d="M300,115 H398" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrPurple)"/>
  <text x="349" y="106" font-size="11" font-weight="600" fill="#6d28d9" text-anchor="middle">sign in</text>

  <!-- ENVIRONMENT panel -->
  <rect x="40" y="170" width="1120" height="370" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="60" y="156" width="190" height="28" rx="14" fill="#2563eb"/>
  <text x="155" y="175" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">ENVIRONMENT · Pulumi</text>
  <text x="1140" y="208" font-size="12" fill="#3b82f6" text-anchor="end">one stack per environment: test · uat · prod</text>

  <rect x="975" y="156" width="165" height="28" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="1057" y="174" font-size="12" font-weight="700" fill="#5b21b6" text-anchor="middle">Deployer · Owner on RG</text>
  
  <!-- VNet and subnets -->
  <rect x="330" y="215" width="810" height="303" rx="14" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="345" y="232" font-size="11" font-weight="600" fill="#2563eb" letter-spacing="1">VIRTUAL NETWORK · /16 per environment</text>
  <g fill="#dbeafe" fill-opacity="0.55" stroke="#3b82f6" stroke-width="1.2">
    <rect x="340" y="240" width="210" height="122" rx="10"/>
    <rect x="600" y="240" width="220" height="122" rx="10"/>
    <rect x="880" y="240" width="250" height="260" rx="10"/>
  </g>
  <g font-size="10.5" font-weight="600" fill="#1d4ed8" text-anchor="middle">
    <text x="445" y="256">snet-apim · /27</text>
    <text x="710" y="256">snet-aca · /23 · delegated</text>
    <text x="1005" y="256">snet-pe · /26 · private endpoints</text>
  </g>

  <!-- Front Door -->
  <g filter="url(#shadow)">
    <rect x="70" y="265" width="230" height="80" rx="12" fill="#ffffff" stroke="#bfdbfe"/>
    <rect x="70" y="265" width="6" height="80" rx="3" fill="#2563eb"/>
  </g>
  <text x="185" y="299" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Front Door</text>
  <text x="185" y="321" font-size="12" fill="#64748b" text-anchor="middle">/api endpoint, web endpoint</text>

  <!-- APIM -->
  <g filter="url(#shadow)">
    <rect x="350" y="265" width="190" height="80" rx="12" fill="#ffffff" stroke="#bfdbfe"/>
    <rect x="350" y="265" width="6" height="80" rx="3" fill="#2563eb"/>
  </g>
  <text x="445" y="299" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">API Management</text>
  <text x="445" y="321" font-size="12" fill="#64748b" text-anchor="middle">APIs from OpenAPI files</text>

  <!-- ACA -->
  <g filter="url(#shadow)">
    <rect x="610" y="265" width="200" height="80" rx="12" fill="#ffffff" stroke="#bfdbfe"/>
    <rect x="610" y="265" width="6" height="80" rx="3" fill="#2563eb"/>
  </g>
  <text x="710" y="299" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Container Apps</text>
  <text x="710" y="321" font-size="12" fill="#64748b" text-anchor="middle">APIs · web · functions</text>

  <!-- PaaS behind private endpoints -->
  <g filter="url(#shadow)">
    <rect x="900" y="270" width="210" height="64" rx="12" fill="#ffffff" stroke="#bfdbfe"/>
    <rect x="900" y="270" width="6" height="64" rx="3" fill="#2563eb"/>
  </g>
  <text x="1005" y="298" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">AI Foundry</text>
  <text x="1005" y="318" font-size="12" fill="#64748b" text-anchor="middle">models and agents</text>
  <g filter="url(#shadow)">
    <rect x="900" y="346" width="210" height="64" rx="12" fill="#ffffff" stroke="#bfdbfe"/>
    <rect x="900" y="346" width="6" height="64" rx="3" fill="#2563eb"/>
  </g>
  <text x="1005" y="374" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">AI Search</text>
  <text x="1005" y="394" font-size="12" fill="#64748b" text-anchor="middle">search service</text>
  <g filter="url(#shadow)">
    <rect x="900" y="422" width="210" height="64" rx="12" fill="#ffffff" stroke="#bfdbfe"/>
    <rect x="900" y="422" width="6" height="64" rx="3" fill="#2563eb"/>
  </g>
  <text x="1005" y="450" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Service Bus</text>
  <text x="1005" y="470" font-size="12" fill="#64748b" text-anchor="middle">namespace</text>

    <path d="M510,145 V263" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrPurple)"/>
  <text x="522" y="206" font-size="12" font-weight="600" fill="#6d28d9">validate token</text>

  <!-- Private DNS zones -->
  <g filter="url(#shadow)">
    <rect x="70" y="430" width="230" height="70" rx="12" fill="#ffffff" stroke="#bfdbfe"/>
    <rect x="70" y="430" width="6" height="70" rx="3" fill="#2563eb"/>
  </g>
  <text x="185" y="461" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Private DNS zones</text>
  <text x="185" y="481" font-size="12" fill="#64748b" text-anchor="middle">per environment, linked to VNet</text>
  <path d="M300,465 H328" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrSlate)"/>

  <!-- Request flow -->
  <path d="M275,140 V263" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrSlate)"/>
  <text x="287" y="206" font-size="12" fill="#334155" font-weight="600">https://…/api</text>
  <path d="M300,305 H348" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrSlate)"/>
  <path d="M540,305 H608" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrSlate)"/>
  <path d="M820,305 H878" stroke="#334155" stroke-width="2" stroke-dasharray="2 4" fill="none" marker-end="url(#arrSlate)"/>

  <!-- Web route (bypasses APIM) -->
  <path d="M185,345 V358 H710 V347" stroke="#334155" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arrSlate)"/>
  <text x="560" y="352" font-size="11" font-weight="600" fill="#334155" text-anchor="middle" paint-order="stroke" stroke="#eff6ff" stroke-width="4">web</text>
    <g transform="translate(0,145)">
  <!-- APP panel -->
  <rect x="40" y="455" width="1120" height="200" rx="18" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <rect x="60" y="441" width="170" height="28" rx="14" fill="#059669"/>
  <text x="145" y="460" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">APP · Aspire</text>
  <rect x="250" y="441" width="165" height="28" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="332" y="459" font-size="12" font-weight="700" fill="#5b21b6" text-anchor="middle">Deployer · Owner on RG</text>
  <text x="70" y="640" font-size="12" font-style="italic" fill="#047857">Receives environment and shared names as parameters, never recreates them.</text>

  <!-- Data -->
  <g filter="url(#shadow)">
    <rect x="70" y="505" width="215" height="100" rx="12" fill="#ffffff" stroke="#a7f3d0"/>
    <rect x="70" y="505" width="6" height="100" rx="3" fill="#059669"/>
  </g>
  <text x="177" y="543" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Data</text>
  <text x="177" y="565" font-size="12" fill="#64748b" text-anchor="middle">Table storage</text>
  <text x="177" y="583" font-size="12" fill="#64748b" text-anchor="middle">Databases</text>

  <!-- OpenAPI -->
  <g filter="url(#shadow)">
    <rect x="325" y="505" width="240" height="100" rx="12" fill="#ffffff" stroke="#a7f3d0"/>
    <rect x="325" y="505" width="6" height="100" rx="3" fill="#059669"/>
  </g>
  <text x="445" y="543" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">API definitions</text>
  <text x="445" y="565" font-size="12" fill="#64748b" text-anchor="middle">OpenAPI file per API</text>
  <text x="445" y="583" font-size="12" fill="#64748b" text-anchor="middle">published to APIM</text>

  <!-- Containers -->
  <g filter="url(#shadow)">
    <rect x="590" y="505" width="240" height="100" rx="12" fill="#ffffff" stroke="#a7f3d0"/>
    <rect x="590" y="505" width="6" height="100" rx="3" fill="#059669"/>
  </g>
  <rect x="602" y="494" width="112" height="20" rx="10" fill="#7c3aed"/>
  <text x="658" y="508" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Managed identity</text>
  <text x="710" y="543" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Workloads</text>
  <text x="710" y="565" font-size="12" fill="#64748b" text-anchor="middle">API, web and function containers</text>
  <text x="710" y="583" font-size="12" fill="#64748b" text-anchor="middle">image from registry, config as env vars</text>

  <!-- Messaging -->
  <g filter="url(#shadow)">
    <rect x="885" y="505" width="240" height="100" rx="12" fill="#ffffff" stroke="#a7f3d0"/>
    <rect x="885" y="505" width="6" height="100" rx="3" fill="#059669"/>
  </g>
  <text x="1005" y="543" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Messaging</text>
  <text x="1005" y="565" font-size="12" fill="#64748b" text-anchor="middle">Topics and subscriptions</text>
  <text x="1005" y="583" font-size="12" fill="#64748b" text-anchor="middle">Queues</text>

  <!-- App to Env arrows -->
  <path d="M445,505 V202" stroke="#059669" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrGreen)"/>
  <text x="457" y="432" font-size="12" font-weight="600" fill="#047857">import OpenAPI</text>
  <path d="M710,505 V202" stroke="#059669" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrGreen)"/>
  <text x="722" y="432" font-size="12" font-weight="600" fill="#047857">deploy workloads</text>
  <path d="M1005,505 V343" stroke="#059669" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrGreen)"/>
  <text x="993" y="432" font-size="12" font-weight="600" fill="#047857" text-anchor="end">create topics, subs, queues</text>

  <!-- SHARED panel -->
  <rect x="40" y="725" width="1120" height="150" rx="18" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <rect x="60" y="711" width="180" height="28" rx="14" fill="#d97706"/>
  <text x="150" y="730" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">SHARED · Pulumi</text>

  <rect x="250" y="711" width="165" height="28" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="332" y="729" font-size="12" font-weight="700" fill="#5b21b6" text-anchor="middle">Deployer · Owner on RG</text>
  <text x="70" y="772" font-size="11" font-weight="600" fill="#b45309" letter-spacing="1">STACK OUTPUTS</text>
  <text x="70" y="792" font-size="12" fill="#92400e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">appConfigEndpoint</text>
  <text x="70" y="810" font-size="12" fill="#92400e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">keyVaultUri</text>
  <text x="70" y="828" font-size="12" fill="#92400e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">acrLoginServer</text>

  <!-- Key Vault -->
  <g filter="url(#shadow)">
    <rect x="310" y="770" width="260" height="70" rx="12" fill="#ffffff" stroke="#fde68a"/>
    <rect x="310" y="770" width="6" height="70" rx="3" fill="#d97706"/>
  </g>
  <text x="440" y="801" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Key Vault</text>
  <text x="440" y="821" font-size="12" fill="#64748b" text-anchor="middle">secrets</text>

  <!-- App Configuration -->
  <g filter="url(#shadow)">
    <rect x="600" y="770" width="220" height="70" rx="12" fill="#ffffff" stroke="#fde68a"/>
    <rect x="600" y="770" width="6" height="70" rx="3" fill="#d97706"/>
  </g>
  <text x="710" y="801" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">App Configuration</text>
  <text x="710" y="821" font-size="12" fill="#64748b" text-anchor="middle">shared config</text>

  <!-- Container Registry -->
  <g filter="url(#shadow)">
    <rect x="850" y="770" width="280" height="70" rx="12" fill="#ffffff" stroke="#fde68a"/>
    <rect x="850" y="770" width="6" height="70" rx="3" fill="#d97706"/>
  </g>
  <text x="990" y="801" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Container Registry</text>
  <text x="990" y="821" font-size="12" fill="#64748b" text-anchor="middle">workload images</text>

  <!-- Shared to App arrows -->
  <path d="M440,770 V690 H620 V607" stroke="#d97706" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arrAmber)"/>
  <text x="530" y="682" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">secrets (RBAC)</text>
  <path d="M710,770 V607" stroke="#d97706" stroke-width="2" fill="none" marker-end="url(#arrAmber)"/>
  <text x="722" y="722" font-size="12" font-weight="600" fill="#b45309">config (RBAC)</text>
  <path d="M990,770 V690 H800 V607" stroke="#d97706" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arrAmber)"/>
  <text x="895" y="682" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">pull / push image (RBAC)</text>

  <!-- Legend -->
  <g font-size="12" fill="#475569">
    <path d="M40,890 H70" stroke="#334155" stroke-width="2"/>
    <text x="78" y="894">request flow (/api via APIM, web direct)</text>
    <path d="M330,890 H360" stroke="#059669" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="368" y="894">app deploys into environment</text>
    <path d="M550,890 H580" stroke="#d97706" stroke-width="2"/>
    <text x="588" y="894">app consumes shared services</text>
    <path d="M790,890 H820" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="828" y="894">identity: Entra app, managed, deployer</text>
  </g>
</g>
</svg>
